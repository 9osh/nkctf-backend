# 生产环境：通过环境变量 / 密钥管理服务注入，勿在仓库中写入真实密钥。
# 启动：SPRING_PROFILES_ACTIVE=prod java -jar nkctf.jar
#
# 必需环境变量：
#   NKCTF_JWT_SECRET      — HS256 密钥，UTF-8 至少 32 字节（建议：openssl rand -base64 48）
#   NKCTF_DB_URL          — 如 jdbc:postgresql://db:5432/nkctf
#   NKCTF_DB_USERNAME
#   NKCTF_DB_PASSWORD
#   NKCTF_REDIS_HOST
#   NKCTF_REDIS_PASSWORD
#
# 可选：
#   NKCTF_REDIS_PORT      — 默认 6379
#   NKCTF_COOKIE_DOMAIN   — 如 .nkctf.cn
#   NKCTF_CORS_ORIGINS    — 逗号分隔的前端源

spring:
  datasource:
    url: ${NKCTF_DB_URL}
    username: ${NKCTF_DB_USERNAME}
    password: ${NKCTF_DB_PASSWORD}

  data:
    redis:
      host: ${NKCTF_REDIS_HOST}
      port: ${NKCTF_REDIS_PORT:6379}
      password: ${NKCTF_REDIS_PASSWORD}

jwt:
  secret: ${NKCTF_JWT_SECRET}

cookie:
  refresh-token:
    secure: true
    domain: ${NKCTF_COOKIE_DOMAIN:}

# 生产关闭 Swagger / OpenAPI 文档
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    root: INFO
    cn.edu.ndky.nkctf: INFO
    org.springframework.security: WARN

# 挑战容器：仅绑定必要端口；Docker API 使用 Unix socket 或 TLS
docker:
  auto-detect: false
  host: unix:///var/run/docker.sock
  security:
    forbid-plain-tcp: true
  container:
    bind-host: 0.0.0.0
    publish-all-ports: false
