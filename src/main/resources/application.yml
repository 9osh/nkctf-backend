server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: nkctf-platform

  # 数据库配置
  datasource:
    url: jdbc:postgresql://localhost:5432/nkctf
    username: nkctf
    password: nkctf123456
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: NkctfHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password: nkctf123456
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: -1ms

  # Session 配置 (7天过期)
  session:
    store-type: redis
    timeout: 7d
    redis:
      namespace: nkctf:session

  # 虚拟线程配置 (Java 21)
  threads:
    virtual:
      enabled: true

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: cn.edu.ndky.nkctf.entity
  type-handlers-package: cn.edu.ndky.nkctf.config
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: nkctf-secret-key-please-change-in-production-environment-2024
  access-token-expiration: 900000    # 15分钟 (毫秒)
  refresh-token-expiration: 604800000  # 7天 (毫秒)
  header: Authorization
  prefix: Bearer

# Refresh Token Cookie 配置
cookie:
  refresh-token:
    name: nkctf_refresh_token
    path: /api/auth              # 仅发送到认证端点
    max-age: 604800              # 7天 (秒)
    http-only: true              # JS 不可访问
    secure: false                # 开发环境设为 false，生产环境应设为 true
    same-site: Lax               # 跨子域名需要使用 Lax
    domain: ""                   # 留空则为当前域名，生产环境设为 .nkctf.cn

# Docker 配置
# 支持多种连接方式：
#   - Unix socket: unix:///var/run/docker.sock (推荐，最安全)
#   - TCP with TLS: tcp://localhost:2376 (生产环境)
#   - TCP: tcp://localhost:2375 (仅开发环境，无加密)
#
# 连接优先级：
#   1. 环境变量 DOCKER_HOST
#   2. 配置项 docker.host
#   3. 自动检测 (当 auto-detect: true)
docker:
  host: ""                        # 留空启用自动检测，或显式指定：
                                  # unix:///var/run/docker.sock
                                  # tcp://localhost:2375
                                  # tcp://localhost:2376
  auto-detect: true               # 自动检测可用的 Docker 端点
  connection-timeout: 30          # 连接超时（秒）
  response-timeout: 45            # 响应超时（秒）
  max-connections: 100            # 最大连接数

  # TLS 配置（用于 tcp://localhost:2376）
  tls:
    enabled: false                # 是否启用 TLS
    verify: true                  # 是否验证服务器证书
    cert-path: ""                 # 证书目录（包含 ca.pem, cert.pem, key.pem）

  # 镜像仓库配置
  registry:
    url: ""
    username: ""
    password: ""

  # 容器配置
  container:
    network: nkctf-challenge-network
    memory-limit: 256m
    cpu-limit: 0.5
    timeout: 3600                 # 容器最大存活时间(秒)
    host: localhost               # 返回给用户的访问地址

  # 资源限制
  limits:
    user-max-containers: 1        # 普通用户最大容器数
    team-max-containers: 3        # 团队最大容器数
    max-extend-count: 3           # 每个容器最大延时次数

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# 日志配置
logging:
  level:
    root: INFO
    cn.edu.ndky.nkctf: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
